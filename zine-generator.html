<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Zine Generator</title>
    <!-- Load Courier Prime Font -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <style>
        body {
            font-family: 'Courier Prime', Courier, monospace;
            background-color: #fff;
            color: #2c2523;
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vintage-card {
            background-color: #faf7f0;
            border: 1px solid #d8cfbc;
            box-shadow: 6px 6px 0px #d0c5af;
            max-width: 42rem;
            width: 100%;
            padding: 2.5rem;
            box-sizing: border-box;
        }
        .input-vintage {
            font-family: 'Courier Prime', Courier, monospace;
            background-color: #fcfbfa;
            border: 1px solid #c8beac;
            color: #2c2523;
            width: 100%;
            padding: 0.75rem;
            font-size: 0.875rem;
            box-sizing: border-box;
        }
        .input-vintage:focus {
            outline: none;
            border-color: #786b59;
        }
        .btn-vintage {
            font-family: 'Courier Prime', Courier, monospace;
            background-color: #3b3331;
            color: #faf7f0;
            width: 100%;
            padding: 1rem;
            font-weight: bold;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-vintage:hover {
            background-color: #241f1e;
        }
        .btn-vintage:disabled {
            background-color: #8c827a;
            cursor: not-allowed;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="vintage-card">
        <h1 style="font-size: 1.75rem; font-weight: bold; margin-bottom: 0.75rem; text-align: center; letter-spacing: 0.1em; text-transform: uppercase;">
            Photo Zine Generator
        </h1>
        
        <div style="border-bottom: 1px dashed #a89f8c; margin: 1rem 0; width: 100%;"></div>

        <p style="font-size: 0.85rem; text-align: center; margin-bottom: 2rem; font-style: italic; color: #5c524e;">
            — Compile up to 36 JPGs and EXIF data into a landscape PDF —
        </p>

        <form id="pdfForm">
            <div class="form-group">
                <label for="docTitle">Document Title *</label>
                <input type="text" id="docTitle" required class="input-vintage" placeholder="e.g., Summer Field Notes, 2026">
            </div>

            <div class="form-group">
                <label for="docDesc">Optional Description</label>
                <textarea id="docDesc" rows="3" class="input-vintage" style="resize: vertical;" placeholder="A collection of landscape photographs shot on 35mm..."></textarea>
            </div>

            <div class="form-group">
                <label for="paperSize">Paper Size</label>
                <select id="paperSize" class="input-vintage" style="cursor: pointer;">
                    <option value="a4" selected>A4 (Landscape)</option>
                    <option value="letter">US Letter (Landscape)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="imageFiles">Select JPG/JPEG Images (Max 36) *</label>
                <div class="input-vintage" style="padding: 0.5rem;">
                    <input type="file" id="imageFiles" multiple accept=".jpg, .jpeg" style="width: 100%; font-size: 0.75rem; cursor: pointer;">
                </div>
            </div>

            <div id="status" style="font-size: 0.75rem; font-style: italic; text-align: center; color: #7a3e12; min-height: 24px; margin-bottom: 1rem;"></div>

            <button type="submit" id="generateBtn" class="btn-vintage">
                Generate Your PDF
            </button>
        </form>
    </div>

    <script>
        document.getElementById('pdfForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('docTitle').value.trim();
            const desc = document.getElementById('docDesc').value.trim();
            const paperSize = document.getElementById('paperSize').value;
            const fileInput = document.getElementById('imageFiles');
            const statusDiv = document.getElementById('status');
            const generateBtn = document.getElementById('generateBtn');

            const files = Array.from(fileInput.files);
            
            if (files.length === 0 || files.length > 36) {
                alert('Please select between 1 and 36 images.');
                return;
            }

            for (let file of files) {
                const isJpg = file.type === 'image/jpeg' || file.name.toLowerCase().endsWith('.jpg') || file.name.toLowerCase().endsWith('.jpeg');
                if (!isJpg) {
                    alert(`File "${file.name}" is not a valid JPG/JPEG image. Please select only JPG or JPEG files.`);
                    return;
                }
            }

            generateBtn.disabled = true;
            statusDiv.textContent = 'Initialising processor...';

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: paperSize
                });

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                const processedImages = [];

                for (let i = 0; i < files.length; i++) {
                    statusDiv.textContent = `Processing image ${i + 1} of ${files.length} (Reading EXIF & resizing)...`;
                    
                    await new Promise(resolve => setTimeout(resolve, 10));

                    const file = files[i];

                    const exifData = await new Promise((resolve) => {
                        EXIF.getData(file, function() {
                            resolve({
                                dateTime: EXIF.getTag(this, "DateTimeOriginal") || EXIF.getTag(this, "DateTime") || "Unknown Date",
                                fNumber: EXIF.getTag(this, "FNumber") ? `f/${EXIF.getTag(this, "FNumber")}` : "",
                                exposureTime: EXIF.getTag(this, "ExposureTime") ? `1/${Math.round(1 / EXIF.getTag(this, "ExposureTime"))}s` : "",
                                iso: EXIF.getTag(this, "ISOSpeedRatings") ? `ISO ${EXIF.getTag(this, "ISOSpeedRatings")}` : ""
                            });
                        });
                    });

                    const optimizedDataUrl = await resizeImage(file, 1200);

                    // Smaller middle-dot separator with tighter spacing for the catalogue index page
                    const settingsPart = [exifData.fNumber, exifData.exposureTime, exifData.iso].filter(Boolean).join(' · ');
                    const exifParts = [file.name, exifData.dateTime !== "Unknown Date" ? exifData.dateTime : "", settingsPart].filter(Boolean);
                    const exifString = exifParts.join('  ·  ');

                    // Standard wider layout for image page footers
                    const footerSettingsPart = [exifData.fNumber, exifData.exposureTime, exifData.iso].filter(Boolean).join(' | ');
                    const footerString = [
                        `File: ${file.name}`,
                        `Date: ${exifData.dateTime}`,
                        footerSettingsPart
                    ].filter(Boolean).join('   •   ');

                    processedImages.push({
                        fileName: file.name,
                        exifString: exifString,
                        footerString: footerString,
                        dataUrl: optimizedDataUrl
                    });
                }

                statusDiv.textContent = 'Compiling PDF pages...';
                await new Promise(resolve => setTimeout(resolve, 20));

                // --- PAGE 1: TITLE PAGE ---
                pdf.setFont('Courier', 'bold');
                pdf.setFontSize(28);
                pdf.text(title, pageWidth / 2, pageHeight / 2 - 10, { align: 'center' });

                if (desc) {
                    pdf.setFont('Courier', 'normal');
                    pdf.setFontSize(14);
                    const splitDesc = pdf.splitTextToSize(desc, pageWidth - 80);
                    pdf.text(splitDesc, pageWidth / 2, pageHeight / 2 + 10, { align: 'center' });
                }

                // --- SUBSEQUENT PAGES: INDIVIDUAL IMAGES ---
                for (let i = 0; i < processedImages.length; i++) {
                    statusDiv.textContent = `Rendering page for image ${i + 1} of ${processedImages.length}...`;
                    const imgItem = processedImages[i];

                    pdf.addPage(paperSize, 'landscape');

                    const maxImgWidth = pageWidth - 40;
                    const maxImgHeight = pageHeight - 45;

                    const imgObj = await loadImage(imgItem.dataUrl);
                    let imgW = imgObj.width;
                    let imgH = imgObj.height;
                    const ratio = Math.min(maxImgWidth / imgW, maxImgHeight / imgH);
                    imgW *= ratio;
                    imgH *= ratio;

                    const imgX = (pageWidth - imgW) / 2;
                    const imgY = 15;

                    pdf.addImage(imgItem.dataUrl, 'JPEG', imgX, imgY, imgW, imgH);

                    pdf.setFont('Courier', 'normal');
                    pdf.setFontSize(9);
                    pdf.text(imgItem.footerString, pageWidth / 2, pageHeight - 12, { align: 'center' });
                }

                // --- PENULTIMATE PAGE: CONTACT SHEET ---
                statusDiv.textContent = 'Generating contact sheet page...';
                pdf.addPage(paperSize, 'landscape');

                pdf.setFont('Courier', 'bold');
                pdf.setFontSize(14);
                pdf.text("CONTACT SHEET", 15, 14);

                const cols = 6;
                const rows = 6;
                const marginLeft = 15;
                const marginTop = 18;
                const marginRight = 15;
                const marginBottom = 12;

                const availableWidth = pageWidth - marginLeft - marginRight;
                const availableHeight = pageHeight - marginTop - marginBottom;

                const cellWidth = availableWidth / cols;
                const cellHeight = availableHeight / rows;

                const thumbMaxWidth = cellWidth - 3;
                const thumbMaxHeight = cellHeight - 6;

                pdf.setFont('Courier', 'normal');
                pdf.setFontSize(6);

                for (let i = 0; i < processedImages.length; i++) {
                    const imgItem = processedImages[i];
                    const colIdx = i % cols;
                    const rowIdx = Math.floor(i / cols);

                    const cellX = marginLeft + (colIdx * cellWidth);
                    const cellY = marginTop + (rowIdx * cellHeight);

                    const imgObj = await loadImage(imgItem.dataUrl);
                    let imgW = imgObj.width;
                    let imgH = imgObj.height;
                    const ratio = Math.min(thumbMaxWidth / imgW, thumbMaxHeight / imgH);
                    imgW *= ratio;
                    imgH *= ratio;

                    const imgX = cellX + (cellWidth - imgW) / 2;
                    const imgY = cellY + 1;

                    pdf.addImage(imgItem.dataUrl, 'JPEG', imgX, imgY, imgW, imgH);

                    let displayName = imgItem.fileName;
                    if (displayName.length > 18) {
                        displayName = displayName.substring(0, 15) + '...';
                    }

                    pdf.text(`${i + 1}. ${displayName}`, cellX + (cellWidth / 2), cellY + cellHeight - 1.5, { align: 'center' });
                }

                // --- FINAL PAGE: CATALOGUE INDEX & EXIF DATA (2 COLUMNS) ---
                statusDiv.textContent = 'Generating catalogue index page...';
                pdf.addPage(paperSize, 'landscape');

                pdf.setFont('Courier', 'bold');
                pdf.setFontSize(14);
                pdf.text("CATALOGUE INDEX & EXIF DATA", 20, 18);

                pdf.setFont('Courier', 'normal');
                pdf.setFontSize(7.5);

                const colWidth = (pageWidth - 45) / 2;
                const startY = 26;
                const lineHeight = 5.2;
                const maxRowsPerCol = Math.ceil(processedImages.length / 2);

                processedImages.forEach((img, idx) => {
                    const col = Math.floor(idx / maxRowsPerCol);
                    const row = idx % maxRowsPerCol;

                    const x = col === 0 ? 20 : (pageWidth / 2 + 5);
                    const y = startY + (row * lineHeight);

                    pdf.text(`${idx + 1}. ${img.exifString}`, x, y);
                });

                // --- SAVE PDF ---
                statusDiv.textContent = 'PDF generated successfully! Downloading...';
                
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const yyyy = now.getFullYear();
                const dateStr = `${dd}${mm}${yyyy}`;
                
                const sanitizedTitle = title.replace(/\s+/g, '_');
                pdf.save(`${sanitizedTitle}_${dateStr}.pdf`);

                statusDiv.textContent = 'Done!';
            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'Error generating PDF. Check console.';
            } finally {
                generateBtn.disabled = false;
            }
        });

        function resizeImage(file, maxDimension) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDimension) {
                                height *= maxDimension / width;
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width *= maxDimension / height;
                                height = maxDimension;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.82));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = src;
            });
        }
    </script>
</body>
</html>
